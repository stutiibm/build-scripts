name: Currency Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build'
        required: true
      version:
        description: 'Version of the package'
        required: true
      validate_build_script:
        description: 'Run build validation script'
        required: true
        default: 'false'
      wheel_build:
        description: 'Create wheel for different Python versions'
        required: true
        default: 'false'
      build_docker:
        description: 'Build docker image'
        required: true
        default: 'false'
      enable_trivy:
        description: 'Enable Trivy scan'
        required: true
        default: 'true'
      enable_syft:
        description: 'Enable Syft scan'
        required: true
        default: 'true'
      enable_grype:
        description: 'Enable Grype scan'
        required: true
        default: 'true'
      unique_id:
        description: 'Unique ID for the build'
        required: false
        default: 'None'
      large-runner-label:
        description: "New runner to use for failing build"
        required: false
        type: choice
        options:
          - ''
          - ubuntu-24.04-ppc64le-2xlarge-p10
          - ubuntu-24.04-ppc64le-4xlarge-p10

run-name: >
  ${{ inputs.large-runner-label != '' &&
      format('Retriggered Currency Build for package {0} and Unique ID {1} on {2}', inputs.package_name, inputs.unique_id, inputs.large-runner-label) ||
      format('Currency Build {0} && Unique ID {1}', inputs.package_name, inputs.unique_id)
  }}

jobs:

  # ---------------------------------------------------------------------------
  # build_info: reads build_info.json, runs read_buildinfo.sh, emits
  # per-UBI-major outputs (script_ubi8, script_ubi9, script_ubi10).
  # Each output is a JSON object string  {"script":"...","tested_on":"..."}
  # or an empty string "" when that UBI version has no script for this package.
  # ---------------------------------------------------------------------------
  build_info:
    runs-on: ubuntu-24.04-ppc64le-p10
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION: ${{ inputs.version }}
      VALIDATE_BUILD_SCRIPT: ${{ inputs.validate_build_script }}
      WHEEL_BUILD: ${{ inputs.wheel_build }}
      build_docker: ${{ inputs.build_docker }}
      ENABLE_TRIVY: ${{ inputs.enable_trivy }}
      ENABLE_SYFT: ${{ inputs.enable_syft }}
      ENABLE_GRYPE: ${{ inputs.enable_grype }}
    outputs:
      script_ubi8:  ${{ steps.emit.outputs.script_ubi8 }}
      script_ubi9:  ${{ steps.emit.outputs.script_ubi9 }}
      script_ubi10: ${{ steps.emit.outputs.script_ubi10 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt install -y jq file

      - name: Install Python dependencies
        run: |
          pip3 install --force-reinstall -v "requests==2.31.0"
          pip3 install --upgrade docker

      - name: Get Build Info and Save Variables
        run: |
          chmod +x ./gha-script/read_buildinfo.sh
          bash ./gha-script/read_buildinfo.sh

      - name: Show contents of variable.sh
        run: |
          echo "===== variable.sh ====="
          cat variable.sh
          echo "======================="

      - name: Emit per-UBI outputs
        id: emit
        run: |
          source variable.sh
          echo "SCRIPT_UBI8=$SCRIPT_UBI8"
          echo "SCRIPT_UBI9=$SCRIPT_UBI9"
          echo "SCRIPT_UBI10=$SCRIPT_UBI10"
          # Use multiline delimiter syntax so JSON double-quotes are not truncated
          {
            echo "script_ubi8<<__EOF__"
            echo "$SCRIPT_UBI8"
            echo "__EOF__"
            echo "script_ubi9<<__EOF__"
            echo "$SCRIPT_UBI9"
            echo "__EOF__"
            echo "script_ubi10<<__EOF__"
            echo "$SCRIPT_UBI10"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

      - name: Create scanner-env.sh
        run: |
          mkdir package-cache
          echo "export VALIDATE_BUILD_SCRIPT='${{ inputs.validate_build_script }}'" > scanner-env.sh
          echo "export BUILD_DOCKER='${{ inputs.build_docker }}'"                  >> scanner-env.sh
          echo "export PACKAGE_NAME='${{ inputs.package_name }}'"                  >> scanner-env.sh
          echo "===== scanner-env.sh ====="
          cat scanner-env.sh
          echo "=========================="
          sudo mv variable.sh package-cache/
          sudo mv scanner-env.sh package-cache/

      - name: Archive package cache
        run: tar -czf package-cache.tar.gz package-cache/

      - name: Upload package-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-cache
          path: package-cache.tar.gz

  # ---------------------------------------------------------------------------
  # install_scan_tools: installs grype + fetches scancode-toolkit source ONCE.
  # Skipped entirely when wheel_build=false.
  # ---------------------------------------------------------------------------
  install_scan_tools:
    needs: build_info
    if: ${{ inputs.wheel_build == 'true' }}
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y wget curl tar jq git

      - name: Fetch scancode-toolkit source
        run: |
          chmod +x ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh
          bash ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh

      - name: Upload scancode-toolkit-src artifact
        uses: actions/upload-artifact@v4
        with:
          name: scancode-toolkit-src
          path: scancode-toolkit-src.tar.gz

      - name: Install grype
        run: |
          GRYPE_VERSION=$(curl -s --retry 3 https://api.github.com/repos/anchore/grype/releases/latest | jq -r '.tag_name')
          echo "Installing grype $GRYPE_VERSION for ppc64le..."
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_checksums.txt
          echo "[INFO] Verifying checksum..."
          if grep "grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz" "grype_${GRYPE_VERSION#v}_checksums.txt" | sha256sum --check --status; then
            echo "[INFO] Checksum verification successful."
            tar -xzf grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          else
            echo "[ERROR] Checksum verification FAILED."
            exit 1
          fi
          mkdir -p scan-tools-bin
          mv grype scan-tools-bin/grype
          chmod +x scan-tools-bin/grype
          scan-tools-bin/grype version

      - name: Archive grype binary
        run: tar -czf scan-tools-cache.tar.gz scan-tools-bin/

      - name: Upload scan-tools-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-tools-cache
          path: scan-tools-cache.tar.gz

  # ---------------------------------------------------------------------------
  # build_package: replaces build_ubi8 / build_ubi9 / build_ubi10.
  # One job per UBI major version, all three run in parallel.
  # Each matrix row carries the pre-resolved script_json for that UBI version
  # so no dynamic key lookup on needs.outputs is needed at step time.
  # Artifact names: updated-package-cache-ubi8/9/10 (unchanged).
  # ---------------------------------------------------------------------------
  build_package:
    needs: build_info
    # Job-level if: guards against both the validate flag AND an empty script_json.
    # This prevents fromJson("") in the env: block from crashing when a package
    # has no script for a particular UBI version.
    if: ${{ inputs.validate_build_script == 'true' && matrix.script_json != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubi: 8
            script_json: ${{ needs.build_info.outputs.script_ubi8 }}
          - ubi: 9
            script_json: ${{ needs.build_info.outputs.script_ubi9 }}
          - ubi: 10
            script_json: ${{ needs.build_info.outputs.script_ubi10 }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le-p10' }}
    env:
      BUILD_SCRIPT: ${{ fromJson(matrix.script_json).script }}
      TESTED_ON:    ${{ fromJson(matrix.script_json).tested_on }}
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Build Package (UBI${{ matrix.ubi }})
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(matrix.script_json).script }}"
          export TESTED_ON="${{ fromJson(matrix.script_json).tested_on }}"
          echo "===== variable.sh ====="; cat package-cache/variable.sh
          echo "BUILD_SCRIPT=$BUILD_SCRIPT  TESTED_ON=$TESTED_ON"
          lscpu
          chmod +x ./gha-script/build_package.sh
          bash ./gha-script/build_package.sh
          cloned_package=$(ls -td -- */ | head -n 1)
          sudo mv "$cloned_package" package-cache/
          echo "export CLONED_PACKAGE=\"$cloned_package\"" >> package-cache/scanner-env.sh
          cd package-cache && sudo chown $USER:$USER -R .
          chmod +x ../gha-script/pre_process.sh
          bash ../gha-script/pre_process.sh
          cd $GITHUB_WORKSPACE
          gzip build_log && mv build_log.gz build_log_UBI${{ matrix.ubi }}.gz
          chmod +x ./gha-script/upload-scripts/upload_file.sh
          bash ./gha-script/upload-scripts/upload_file.sh build_log_UBI${{ matrix.ubi }}.gz
      - name: Fix permissions
        run: sudo chown -R $USER:$USER package-cache && sudo chmod -R u+rwX,go+rX,go-w package-cache
      - name: Archive updated package-cache
        run: tar -czf package-cache.tar.gz package-cache/
      - name: Upload updated package-cache (UBI${{ matrix.ubi }})
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-cache-ubi${{ matrix.ubi }}
          path: package-cache.tar.gz

  # ---------------------------------------------------------------------------
  # wheel_build: replaces all 13 wheel_build_ubiN_pyXXX jobs.
  # One matrix row per (ubi, python-version) combination.
  # UBI10 does not support py3.10 / py3.11 — those rows are simply absent.
  # coe=true rows map to continue-on-error: true (experimental Python versions).
  # Artifact names and folder names (wheel_scancode_pyXXX, grype_wheel_pyXXX)
  # are identical to the original jobs so downstream jobs are unaffected.
  # ---------------------------------------------------------------------------
  wheel_build:
    needs: [build_info, install_scan_tools]
    # Job-level if: guards against an empty script_json for this UBI version,
    # preventing fromJson("") in the env: block from crashing at job startup.
    if: ${{ inputs.wheel_build == 'true' && matrix.script_json != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # UBI8 — py310 to py314
          - { ubi: 8,  py: "3.10", py_tag: "py310", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi8 }}" }
          - { ubi: 8,  py: "3.11", py_tag: "py311", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi8 }}" }
          - { ubi: 8,  py: "3.12", py_tag: "py312", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi8 }}" }
          - { ubi: 8,  py: "3.13", py_tag: "py313", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi8 }}" }
          - { ubi: 8,  py: "3.14", py_tag: "py314", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi8 }}" }
          # UBI9 — py310 to py314
          - { ubi: 9,  py: "3.10", py_tag: "py310", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi9 }}" }
          - { ubi: 9,  py: "3.11", py_tag: "py311", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi9 }}" }
          - { ubi: 9,  py: "3.12", py_tag: "py312", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi9 }}" }
          - { ubi: 9,  py: "3.13", py_tag: "py313", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi9 }}" }
          - { ubi: 9,  py: "3.14", py_tag: "py314", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi9 }}" }
          # UBI10 — py312 to py314 only (py310/py311 not supported)
          - { ubi: 10, py: "3.12", py_tag: "py312", coe: false, script_json: "${{ needs.build_info.outputs.script_ubi10 }}" }
          - { ubi: 10, py: "3.13", py_tag: "py313", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi10 }}" }
          - { ubi: 10, py: "3.14", py_tag: "py314", coe: true,  script_json: "${{ needs.build_info.outputs.script_ubi10 }}" }
    continue-on-error: ${{ matrix.coe }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le-p10' }}
    env:
      PYTHON_VERSION: ${{ matrix.py }}
      BUILD_SCRIPT:   ${{ fromJson(matrix.script_json).script }}
      TESTED_ON:      ${{ fromJson(matrix.script_json).tested_on }}
      PACKAGE_NAME:   ${{ inputs.package_name }}
      VERSION:        ${{ inputs.version }}
      GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
      GHA_CURRENCY_SERVICE_ID:         ${{ secrets.GHA_CURRENCY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt update -y
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        uses: actions/download-artifact@v4
        with:
          name: scan-tools-cache
      - name: Extract scan tools
        run: tar -xzf scan-tools-cache.tar.gz && echo "$GITHUB_WORKSPACE/scan-tools-bin" >> $GITHUB_PATH
      - name: Cache pip (scancode)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: scancode-pip-ppc64le-v32.4.0
      - name: Download scancode-toolkit-src
        uses: actions/download-artifact@v4
        with:
          name: scancode-toolkit-src
      - name: Extract scancode-toolkit source
        run: tar -xzf scancode-toolkit-src.tar.gz
      - name: Run build_wheels.sh
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(matrix.script_json).script }}"
          export TESTED_ON="${{ fromJson(matrix.script_json).tested_on }}"
          chmod +x ./gha-script/build_wheels.sh
          bash ./gha-script/build_wheels.sh
          WHEEL_FILE=$(ls *.whl 2>/dev/null | head -n 1)
          PY_TAG="${{ matrix.py_tag }}"
          LOG_NAME="${WHEEL_FILE:+${WHEEL_FILE%.whl}_${PY_TAG}_log}.gz"
          [ -z "$WHEEL_FILE" ] && LOG_NAME="wheel_build_log_ubi${{ matrix.ubi }}_${PY_TAG}.gz"
          gzip wheel_build_log && mv wheel_build_log.gz "$LOG_NAME"
          bash ./gha-script/upload-scripts/upload_file.sh "$LOG_NAME"
      - name: Run scancode scan on wheel
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/scancode_wheel_scan.sh
          bash ./gha-script/scanner-scripts/scancode_wheel_scan.sh
      - name: Run grype scan on wheel
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype"
          chmod +x ./gha-script/scanner-scripts/grype_wheel_scan.sh
          bash ./gha-script/scanner-scripts/grype_wheel_scan.sh
      - name: Upload wheel scan results
        run: |
          source package-cache/variable.sh
          PY_TAG="${{ matrix.py_tag }}"
          mkdir -p wheel_scancode_${PY_TAG}
          find . -maxdepth 1 -name "*_output.json" ! -name "*_grype_output.json" -exec cp {} wheel_scancode_${PY_TAG}/ \;
          tar czf wheel_scancode_${PY_TAG}.tar.gz wheel_scancode_${PY_TAG}
          bash ./gha-script/upload-scripts/upload_file.sh wheel_scancode_${PY_TAG}.tar.gz
          mkdir -p grype_wheel_${PY_TAG}
          find . -maxdepth 1 -name "*_grype_output.json" -exec cp {} grype_wheel_${PY_TAG}/ \;
          tar czf grype_wheel_${PY_TAG}.tar.gz grype_wheel_${PY_TAG}
          bash ./gha-script/upload-scripts/upload_file.sh grype_wheel_${PY_TAG}.tar.gz
      - name: Upload wheel to COS
        run: |
          if ls *.whl 1>/dev/null 2>&1; then
            sudo chmod a+r *.whl
            WHEEL_FILE=$(ls *.whl)
            SHA256_VALUE=$(cat sha256.sha)
            chmod +x ./gha-script/upload-scripts/upload_wheel.sh
            bash ./gha-script/upload-scripts/upload_wheel.sh $WHEEL_FILE $SHA256_VALUE
          else
            echo "No wheel file found!"; exit 1
          fi
      - name: Upload CVE report
        run: |
          WHEEL_FILE=$(ls *.whl 2>/dev/null | head -n 1)
          if [ -n "$WHEEL_FILE" ]; then
            CVE_REPORT="${WHEEL_FILE%.whl}_cve_report.json"
            [ -f "$CVE_REPORT" ] && bash ./gha-script/upload-scripts/upload_file.sh "$CVE_REPORT" || echo "CVE report not found — skipping."
          fi

  # ---------------------------------------------------------------------------
  # WHEEL LICENSE EXTRACT — one per UBI version.
  # Downloads per-Python-version scancode JSON from COS and extracts licenses.
  # Runs after all wheel jobs for that UBI version finish (at least one must succeed).
  # NOTE: these three jobs cannot be collapsed into a matrix because their
  # needs: lists differ (UBI8/9 depend on 5 wheel jobs, UBI10 on 3) and
  # their if: conditions check individual job results by name — both of which
  # are static requirements in GitHub Actions.
  # ---------------------------------------------------------------------------

  wheel_license_extract_ubi8:
    needs: [build_info, wheel_build]
    if: |
      always() &&
      inputs.wheel_build == 'true' &&
      needs.build_info.outputs.script_ubi8 != '' &&
      needs.wheel_build.result == 'success'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scancode JSON outputs from COS and extract licenses
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          mkdir -p all_wheel_scancode
          chmod +x ./gha-script/download-scripts/download_file.sh
          for PY_VER in py310 py311 py312 py313 py314; do
            ARCHIVE="wheel_scancode_${PY_VER}.tar.gz"
            bash ./gha-script/download-scripts/download_file.sh "$ARCHIVE" \
              || echo "Warning: $ARCHIVE not found on COS (skipped)"
            if [ -f "$ARCHIVE" ]; then
              tar -xzf "$ARCHIVE"
              find "wheel_scancode_${PY_VER}" -type f -name "*.json" \
                -exec cp {} all_wheel_scancode/ \; 2>/dev/null || true
            fi
          done
          echo "Scancode JSON files collected:"; ls -lh all_wheel_scancode
          for JSON_FILE in all_wheel_scancode/*.json; do
            [ -f "$JSON_FILE" ] || { echo "No JSON files — skipping."; break; }
            echo "--- $JSON_FILE ---"
            python3 ./gha-script/licenses_extract_script.py "$JSON_FILE"
          done

  wheel_license_extract_ubi9:
    needs: [build_info, wheel_build]
    if: |
      always() &&
      inputs.wheel_build == 'true' &&
      needs.build_info.outputs.script_ubi9 != '' &&
      needs.wheel_build.result == 'success'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scancode JSON outputs from COS and extract licenses
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          mkdir -p all_wheel_scancode
          chmod +x ./gha-script/download-scripts/download_file.sh
          for PY_VER in py310 py311 py312 py313 py314; do
            ARCHIVE="wheel_scancode_${PY_VER}.tar.gz"
            bash ./gha-script/download-scripts/download_file.sh "$ARCHIVE" \
              || echo "Warning: $ARCHIVE not found on COS (skipped)"
            if [ -f "$ARCHIVE" ]; then
              tar -xzf "$ARCHIVE"
              find "wheel_scancode_${PY_VER}" -type f -name "*.json" \
                -exec cp {} all_wheel_scancode/ \; 2>/dev/null || true
            fi
          done
          echo "Scancode JSON files collected:"; ls -lh all_wheel_scancode
          for JSON_FILE in all_wheel_scancode/*.json; do
            [ -f "$JSON_FILE" ] || { echo "No JSON files — skipping."; break; }
            echo "--- $JSON_FILE ---"
            python3 ./gha-script/licenses_extract_script.py "$JSON_FILE"
          done

  wheel_license_extract_ubi10:
    needs: [build_info, wheel_build]
    if: |
      always() &&
      inputs.wheel_build == 'true' &&
      needs.build_info.outputs.script_ubi10 != '' &&
      needs.wheel_build.result == 'success'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scancode JSON outputs from COS and extract licenses
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          mkdir -p all_wheel_scancode
          chmod +x ./gha-script/download-scripts/download_file.sh
          for PY_VER in py312 py313 py314; do
            ARCHIVE="wheel_scancode_${PY_VER}.tar.gz"
            bash ./gha-script/download-scripts/download_file.sh "$ARCHIVE" \
              || echo "Warning: $ARCHIVE not found on COS (skipped)"
            if [ -f "$ARCHIVE" ]; then
              tar -xzf "$ARCHIVE"
              find "wheel_scancode_${PY_VER}" -type f -name "*.json" \
                -exec cp {} all_wheel_scancode/ \; 2>/dev/null || true
            fi
          done
          echo "Scancode JSON files collected:"; ls -lh all_wheel_scancode
          for JSON_FILE in all_wheel_scancode/*.json; do
            [ -f "$JSON_FILE" ] || { echo "No JSON files — skipping."; break; }
            echo "--- $JSON_FILE ---"
            python3 ./gha-script/licenses_extract_script.py "$JSON_FILE"
          done

  # ---------------------------------------------------------------------------
  # source_scanner: replaces source_scanner_ubi8 / source_scanner_ubi9 / source_scanner_ubi10.
  # Runs Trivy, Syft, Grype on the cloned source tree for each UBI version.
  # Depends on the corresponding build_package matrix instance succeeding.
  # The updated-package-cache artifact name is templated with matrix.ubi.
  # ---------------------------------------------------------------------------
  source_scanner:
    needs: build_package
    if: ${{ always() && inputs.validate_build_script == 'true' && needs.build_package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        ubi: [8, 9, 10]
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download updated package-cache (UBI${{ matrix.ubi }})
        uses: actions/download-artifact@v4
        with:
          name: updated-package-cache-ubi${{ matrix.ubi }}
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        if: ${{ inputs.enable_grype == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: scan-tools-cache
      - name: Extract scan tools
        if: ${{ inputs.enable_grype == 'true' }}
        run: tar -xzf scan-tools-cache.tar.gz
      - name: Prepare scanner environment
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          cat package-cache/scanner-env.sh
      - name: Run Trivy Scan
        if: ${{ inputs.enable_trivy == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/trivy_code_scan.sh
          bash ./gha-script/scanner-scripts/trivy_code_scan.sh
          mkdir source_trivy
          mv package-cache/trivy_source_vulnerabilities_results.json \
             package-cache/trivy_source_sbom_results.cyclonedx source_trivy
      - name: Run Syft Scan
        if: ${{ inputs.enable_syft == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/syft_code_scan.sh
          bash ./gha-script/scanner-scripts/syft_code_scan.sh
          mkdir source_syft
          mv package-cache/syft_source_sbom_results.json source_syft
      - name: Run Grype Scan
        if: ${{ inputs.enable_grype == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype"
          chmod +x ./gha-script/scanner-scripts/grype_code_scan.sh
          bash ./gha-script/scanner-scripts/grype_code_scan.sh
          mkdir source_grype
          mv package-cache/grype_source_sbom_results.json \
             package-cache/grype_source_vulnerabilities_results.json source_grype
      - name: Upload Scanner Results
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          mkdir source
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          find source_trivy -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_syft  -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_grype -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          tar cvzf source_scanner_ubi${{ matrix.ubi }}.tar.gz source
          chmod +x ./gha-script/upload-scripts/upload_file.sh
          bash ./gha-script/upload-scripts/upload_file.sh source_scanner_ubi${{ matrix.ubi }}.tar.gz

  # ---------------------------------------------------------------------------
  # build_docker / image_scanner
  # ---------------------------------------------------------------------------
  build_docker:
    needs: build_info
    if: ${{ inputs.build_docker == 'true' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le-p10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Build Docker Image
        run: |
          ls package-cache
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/build_docker.sh
          bash ./gha-script/build_docker.sh
          docker save -o package-cache/image.tar "$IMAGE_NAME"
          docker images
      - name: Upload Docker Image
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/upload-scripts/upload_docker_image.sh
          bash ./gha-script/upload-scripts/upload_docker_image.sh
      - name: Archive package cache with image
        run: tar -czf package-cache.tar.gz package-cache/
      - name: Upload package-cache with image.tar
        uses: actions/upload-artifact@v4
        with:
          name: package-cache-with-image
          path: package-cache.tar.gz

  image_scanner:
    needs: build_docker
    if: ${{ inputs.build_docker == 'true' }}
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache-with-image
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        if: ${{ inputs.enable_grype == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: scan-tools-cache
      - name: Extract scan tools
        if: ${{ inputs.enable_grype == 'true' }}
        run: tar -xzf scan-tools-cache.tar.gz
      - name: Load Docker Image
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          docker load -i "package-cache/image.tar"
      - name: Run Trivy Image Scan
        if: ${{ inputs.enable_trivy == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/trivy_image_scan.sh
          bash ./gha-script/scanner-scripts/trivy_image_scan.sh
          mkdir image_trivy
          mv trivy_image_vulnerabilities_results.json trivy_image_sbom_results.cyclonedx image_trivy
      - name: Run Syft Image Scan
        if: ${{ inputs.enable_syft == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/syft_image_scan.sh
          bash ./gha-script/scanner-scripts/syft_image_scan.sh
          mkdir image_syft
          mv syft_image_sbom_results.json image_syft
      - name: Run Grype Image Scan
        if: ${{ inputs.enable_grype == 'true' }}
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype"
          chmod +x ./gha-script/scanner-scripts/grype_image_scan.sh
          bash ./gha-script/scanner-scripts/grype_image_scan.sh
          mkdir image_grype
          mv grype_image_sbom_results.json grype_image_vulnerabilities_results.json image_grype
      - name: Upload Image Scanner Results
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          mkdir image
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          find image_trivy -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          find image_syft  -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          find image_grype -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          tar cvzf image_scanner.tar.gz image
          chmod +x ./gha-script/upload-scripts/upload_file.sh
          bash ./gha-script/upload-scripts/upload_file.sh image_scanner.tar.gz

  # ---------------------------------------------------------------------------
  # final_summary: runs after all parallel tracks complete.
  # Uses always() so it runs even when optional jobs (ubi8/ubi10) were skipped.
  # Requires at least one build_package matrix instance to have succeeded.
  # ---------------------------------------------------------------------------
  final_summary:
    name: Final Summary Stage
    needs:
      - build_package
      - wheel_license_extract_ubi8
      - wheel_license_extract_ubi9
      - wheel_license_extract_ubi10
      - source_scanner
    if: |
      always() &&
      needs.build_package.result == 'success'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v4
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Create and activate venv
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests deprecated xlsxwriter packaging
      - name: Summarize build results
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION:      ${{ inputs.version }}
          IAM_WRITER_API_KEY:    ${{ secrets.IAM_WRITER_API_KEY }}
          SERVICE_INSTANCE_ID:   ${{ secrets.SERVICE_INSTANCE_ID }}
        run: |
          chmod +x package-cache/variable.sh
          chmod +x package-cache/scanner-env.sh
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          echo "===== variable.sh =====";    cat package-cache/variable.sh
          echo "===== scanner-env.sh ====="; cat package-cache/scanner-env.sh
          echo "Package: ${PACKAGE_NAME}  Version: ${VERSION}"
          chmod +x process_bom/*.py || true
          export PYTHONPATH="/tmp/_actions-runner-working-dir/build-scripts/build-scripts:/tmp/_actions-runner-working-dir/build-scripts/build-scripts/process_bom"
          python -m process_bom.run_currency_processor
