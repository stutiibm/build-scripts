name: Currency Build
on:
  workflow_dispatch:
    branches:
      - master

    inputs:
      package_name:
        description: 'Name of the package to build'
        required: true
      version:
        description: 'Version of the package'
        required: true
      validate_build_script:
        description: 'Run build validation script'
        required: true
        default: 'false'
      wheel_build:
        description: 'Create wheel for different Python versions'
        required: true
        default: 'false'
      build_docker:
        description: 'Build docker image'
        required: true
        default: 'false'
      enable_trivy:
        description: 'Enable Trivy scan'
        required: true
        default: 'true'
      enable_syft:
        description: 'Enable Syft scan'
        required: true
        default: 'true'
      enable_grype:
        description: 'Enable Grype scan'
        required: true
        default: 'true'
      unique_id:
        description: 'Unique ID for the build'
        required: false
        default: 'None'
      large-runner-label:
        description: "New runner to use for failing build"
        required: false
        type: choice
        options:
          - ''
          - ubuntu-24.04-ppc64le-2xlarge-p10
          - ubuntu-24.04-ppc64le-4xlarge-p10

run-name: >
  ${{ inputs.large-runner-label != '' &&
      format('Retriggered Currency Build for package {0} and Unique ID {1} on {2}', inputs.package_name, inputs.unique_id, inputs.large-runner-label) ||
      format('Currency Build {0} && Unique ID {1}', inputs.package_name, inputs.unique_id)
  }}


jobs:
  build_info:
    runs-on: ubuntu-24.04-ppc64le-p10
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION: ${{ inputs.version }}
      VALIDATE_BUILD_SCRIPT: ${{ inputs.validate_build_script }}
      WHEEL_BUILD: ${{ inputs.wheel_build }}
      build_docker: ${{ inputs.build_docker }}
      ENABLE_TRIVY: ${{ inputs.enable_trivy }}
      ENABLE_SYFT: ${{ inputs.enable_syft }}
      ENABLE_GRYPE: ${{ inputs.enable_grype }}
    outputs:
      # Full JSON array — kept for source_scanner backward-compat
      build_scripts: ${{ steps.emit_build_scripts.outputs.build_scripts }}
      # Individual slots — each is a {script, tested_on} JSON object or ""
      # slot0 is always populated (every package has at least one script).
      # slot1/slot2 are non-empty only for multi-UBI packages.
      slot0: ${{ steps.emit_build_scripts.outputs.slot0 }}
      slot1: ${{ steps.emit_build_scripts.outputs.slot1 }}
      slot2: ${{ steps.emit_build_scripts.outputs.slot2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt install -y jq file
          
      - name: Install Python dependencies
        run: |
          pip3 install --force-reinstall -v "requests==2.31.0"
          pip3 install --upgrade docker

      - name: Get Build Info and Save Variables
        run: |
          chmod +x ./gha-script/read_buildinfo.sh
          bash ./gha-script/read_buildinfo.sh

      - name: Show contents of variable.sh
        run: |
          echo "===== variable.sh ====="
          cat variable.sh
          echo "======================="

      - name: Emit build_scripts output for matrix
        id: emit_build_scripts
        run: |
          source variable.sh
          echo "BUILD_SCRIPTS_JSON=$BUILD_SCRIPTS_JSON"
          echo "build_scripts=$BUILD_SCRIPTS_JSON" >> $GITHUB_OUTPUT
          echo "slot0=$SLOT0"                      >> $GITHUB_OUTPUT
          echo "slot1=$SLOT1"                      >> $GITHUB_OUTPUT
          echo "slot2=$SLOT2"                      >> $GITHUB_OUTPUT

      - name: Create scanner-env.sh
        run: |
          echo "Creating package-cache........."
          mkdir package-cache
          echo "Creating scanner-env.sh ......."
          echo "export VALIDATE_BUILD_SCRIPT='${{ inputs.validate_build_script }}'" > scanner-env.sh
          echo "export BUILD_DOCKER='${{ inputs.build_docker }}'" >> scanner-env.sh
          echo "export PACKAGE_NAME='${{ inputs.package_name }}'" >> scanner-env.sh
          echo "===== scanner-env.sh ====="
          cat scanner-env.sh
          echo "=========================="
          echo "Moving scanner-env.sh and variable.sh into package-cache............"
          sudo mv variable.sh package-cache
          sudo mv scanner-env.sh package-cache
          echo "Moved scanner-env.sh and variable.sh into package-cache............"

      - name: Archive package cache
        run: tar -czf package-cache.tar.gz package-cache/

      - name: Upload variable.sh and scanner-env.sh via package-cache
        uses: actions/upload-artifact@v6
        with:
          name: package-cache
          path: package-cache.tar.gz

  # ---------------------------------------------------------------------------
  # install_scan_tools: Installs grype ONCE (static Go binary — fully portable)
  # and caches it as an artifact for all wheel_build_pyXXX jobs.
  # Scancode-toolkit is fetched once and distributed as an artifact too.
  # ---------------------------------------------------------------------------
  install_scan_tools:
    needs: build_info
    if: ${{ inputs.wheel_build == 'true' }}
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y wget curl tar jq git

      - name: Fetch scancode-toolkit source
        run: |
          chmod +x ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh
          bash ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh

      - name: Upload scancode-toolkit-src artifact
        uses: actions/upload-artifact@v6
        with:
          name: scancode-toolkit-src
          path: scancode-toolkit-src.tar.gz

      - name: Install grype
        run: |
          GRYPE_VERSION=$(curl -s --retry 3 https://api.github.com/repos/anchore/grype/releases/latest | jq -r '.tag_name')
          echo "Installing grype $GRYPE_VERSION for ppc64le..."
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_checksums.txt
          echo "[INFO] Verifying checksum..."
          if grep "grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz" "grype_${GRYPE_VERSION#v}_checksums.txt" | sha256sum --check --status; then
            echo "[INFO] Checksum verification successful."
            tar -xzf grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          else
            echo "[ERROR] Checksum verification FAILED for grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz."
            exit 1
          fi
          mkdir -p scan-tools-bin
          mv grype scan-tools-bin/grype
          chmod +x scan-tools-bin/grype
          echo "Grype version:"
          scan-tools-bin/grype version

      - name: Archive grype binary
        run: tar -czf scan-tools-cache.tar.gz scan-tools-bin/

      - name: Upload scan-tools-cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: scan-tools-cache
          path: scan-tools-cache.tar.gz

  # ---------------------------------------------------------------------------
  # ubi_slot_0/1/2: each calls the reusable build-one-ubi.yaml workflow.
  # slot0 always runs (every package has at least one script).
  # slot1/slot2 only run when the package has 2 or 3 UBI scripts respectively.
  #
  # python_versions:
  #   UBI8/UBI9 → all 5 versions ["3.10","3.11","3.12","3.13","3.14"]
  #   UBI10      → 4 versions    ["3.11","3.12","3.13","3.14"]  (py3.10 N/A on UBI10)
  # The caller decides the list based on the tested_on value for each slot.
  # ---------------------------------------------------------------------------

  ubi_slot_0:
    needs:
      - build_info
      - install_scan_tools
    # slot0 is always populated — no empty-check needed
    uses: ./.github/workflows/build-one-ubi.yaml
    with:
      script: ${{ fromJson(needs.build_info.outputs.slot0).script }}
      tested_on: ${{ fromJson(needs.build_info.outputs.slot0).tested_on }}
      python_versions: >-
        ${{
          startsWith(fromJson(needs.build_info.outputs.slot0).tested_on, 'UBI:10') ||
          startsWith(fromJson(needs.build_info.outputs.slot0).tested_on, 'UBI10')
          && '["3.11","3.12","3.13","3.14"]'
          || '["3.10","3.11","3.12","3.13","3.14"]'
        }}
      wheel_build_enabled: ${{ inputs.wheel_build }}
      validate_build_script: ${{ inputs.validate_build_script }}
      package_name: ${{ inputs.package_name }}
      version: ${{ inputs.version }}
      large_runner: ${{ inputs.large-runner-label }}
    secrets: inherit

  ubi_slot_1:
    needs:
      - build_info
      - install_scan_tools
    if: ${{ needs.build_info.outputs.slot1 != '' }}
    uses: ./.github/workflows/build-one-ubi.yaml
    with:
      script: ${{ fromJson(needs.build_info.outputs.slot1).script }}
      tested_on: ${{ fromJson(needs.build_info.outputs.slot1).tested_on }}
      python_versions: >-
        ${{
          startsWith(fromJson(needs.build_info.outputs.slot1).tested_on, 'UBI:10') ||
          startsWith(fromJson(needs.build_info.outputs.slot1).tested_on, 'UBI10')
          && '["3.11","3.12","3.13","3.14"]'
          || '["3.10","3.11","3.12","3.13","3.14"]'
        }}
      wheel_build_enabled: ${{ inputs.wheel_build }}
      validate_build_script: ${{ inputs.validate_build_script }}
      package_name: ${{ inputs.package_name }}
      version: ${{ inputs.version }}
      large_runner: ${{ inputs.large-runner-label }}
    secrets: inherit

  ubi_slot_2:
    needs:
      - build_info
      - install_scan_tools
    if: ${{ needs.build_info.outputs.slot2 != '' }}
    uses: ./.github/workflows/build-one-ubi.yaml
    with:
      script: ${{ fromJson(needs.build_info.outputs.slot2).script }}
      tested_on: ${{ fromJson(needs.build_info.outputs.slot2).tested_on }}
      python_versions: >-
        ${{
          startsWith(fromJson(needs.build_info.outputs.slot2).tested_on, 'UBI:10') ||
          startsWith(fromJson(needs.build_info.outputs.slot2).tested_on, 'UBI10')
          && '["3.11","3.12","3.13","3.14"]'
          || '["3.10","3.11","3.12","3.13","3.14"]'
        }}
      wheel_build_enabled: ${{ inputs.wheel_build }}
      validate_build_script: ${{ inputs.validate_build_script }}
      package_name: ${{ inputs.package_name }}
      version: ${{ inputs.version }}
      large_runner: ${{ inputs.large-runner-label }}
    secrets: inherit

  # wheel_license_extract: Runs after all wheel builds complete. Downloads the
  # per-Python-version scancode JSON files from COS and extracts SPDX licenses.
  # Waits for all 3 slots; at least one must succeed.
  # ---------------------------------------------------------------------------
  wheel_license_extract:
    if: ${{
      inputs.wheel_build == 'true' &&
      (needs.ubi_slot_0.result == 'success' ||
       needs.ubi_slot_1.result == 'success' ||
       needs.ubi_slot_2.result == 'success')
    }}
    needs:
      - ubi_slot_0
      - ubi_slot_1
      - ubi_slot_2
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download package-cache
        uses: actions/download-artifact@v7
        with:
          name: package-cache

      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz

      - name: Download scancode JSON outputs from COS
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh

          echo "Downloading per-version scancode archives from COS..."
          mkdir -p all_wheel_scancode

          chmod +x ./gha-script/download-scripts/download_file.sh
          for PY_VER in py310 py311 py312 py313 py314; do
            ARCHIVE="wheel_scancode_${PY_VER}.tar.gz"
            echo "Attempting to download $ARCHIVE..."
            bash ./gha-script/download-scripts/download_file.sh "$ARCHIVE" \
              || echo "Warning: $ARCHIVE not found on COS (skipped)"
            if [ -f "$ARCHIVE" ]; then
              tar -xzf "$ARCHIVE"
              find "wheel_scancode_${PY_VER}" -type f -name "*.json" \
                -exec cp {} all_wheel_scancode/ \; 2>/dev/null || true
            fi
          done

          echo "All scancode JSON files available:"
          ls -lh all_wheel_scancode

      - name: Extract licenses from each scancode JSON
        run: |
          for JSON_FILE in all_wheel_scancode/*.json; do
            [ -f "$JSON_FILE" ] || { echo "No JSON files found — skipping."; break; }
            echo "--- $JSON_FILE ---"
            python3 ./gha-script/licenses_extract_script.py "$JSON_FILE"
          done

  source_scanner:
    needs:
      - build_info
      - ubi_slot_0
    if: ${{ inputs.validate_build_script == 'true' }}
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v6

      - name: Download package-cache
        uses: actions/download-artifact@v7
        with:
          # Use slot0's cache — source tree is the same for all UBI variants.
          name: updated-package-cache-${{ fromJson(needs.build_info.outputs.slot0).script }}

      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz

      - name: Prepare scanner environment
        run: |
          echo "Sourcing variable.sh..."
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          cat package-cache/scanner-env.sh

      - name: Run Trivy Scan
        if: ${{ inputs.enable_trivy == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/trivy_code_scan.sh
          bash ./gha-script/scanner-scripts/trivy_code_scan.sh
          mkdir source_trivy
          mv package-cache/trivy_source_vulnerabilities_results.json package-cache/trivy_source_sbom_results.cyclonedx source_trivy

      - name: Run Syft Scan
        if: ${{ inputs.enable_syft == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/syft_code_scan.sh
          bash ./gha-script/scanner-scripts/syft_code_scan.sh
          mkdir source_syft
          mv package-cache/syft_source_sbom_results.json source_syft

      - name: Run Grype Scan
        if: ${{ inputs.enable_grype == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/grype_code_scan.sh
          bash ./gha-script/scanner-scripts/grype_code_scan.sh
          mkdir source_grype
          mv package-cache/grype_source_sbom_results.json package-cache/grype_source_vulnerabilities_results.json source_grype

      - name: Upload Scanner Results
        env:
           GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          mkdir source
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          find source_trivy -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_syft -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_grype -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          tar cvzf source_scanner.tar.gz source
          chmod +x ./gha-script/upload-scripts/upload_file.sh
          bash ./gha-script/upload-scripts/upload_file.sh source_scanner.tar.gz

  build_docker:
    needs: build_info
    if: ${{ inputs.build_docker == 'true' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'ubuntu-24.04-ppc64le-p10' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download package-cache
        uses: actions/download-artifact@v7
        with:
          name: package-cache

      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz

      - name: Build Docker Image
        run: |
          echo "................................Sourcing scanner-env.sh............................."
          ls package-cache
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/build_docker.sh
          bash ./gha-script/build_docker.sh
          docker save -o package-cache/image.tar "$IMAGE_NAME"
          docker images

      - name: Upload Docker Image
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/upload-scripts/upload_docker_image.sh
          bash ./gha-script/upload-scripts/upload_docker_image.sh

      - name: Archive package cache with image
        run: tar -czf package-cache.tar.gz package-cache/

      - name: Upload package-cache with image.tar
        uses: actions/upload-artifact@v6
        with:
          name: package-cache-with-image
          path: package-cache.tar.gz

  image_scanner:
    needs: build_docker
    if: ${{ inputs.build_docker == 'true' }}
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v6

      - name: Download package-cache
        uses: actions/download-artifact@v7
        with:
          name: package-cache-with-image

      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz

      - name: Load Docker Image
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          docker load -i "package-cache/image.tar"

      - name: Run Trivy Image Scan
        if: ${{ inputs.enable_trivy == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/trivy_image_scan.sh
          bash ./gha-script/scanner-scripts/trivy_image_scan.sh
          mkdir image_trivy
          mv trivy_image_vulnerabilities_results.json trivy_image_sbom_results.cyclonedx image_trivy

      - name: Run Syft Image Scan
        if: ${{ inputs.enable_syft == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./script/scanner-scripts/syft_image_scan.sh
          bash ./script/scanner-scripts/syft_image_scan.sh
          mkdir image_syft
          mv syft_image_sbom_results.json image_syft

      - name: Run Grype Image Scan
        if: ${{ inputs.enable_grype == 'true' }}
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/grype_image_scan.sh
          bash ./gha-script/scanner-scripts/grype_image_scan.sh
          mkdir image_grype
          mv grype_image_sbom_results.json grype_image_vulnerabilities_results.json image_grype

      - name: Upload Image Scanner Results
        env:
          GHA_CURRENCY_SERVICE_ID_API_KEY: ${{ secrets.GHA_CURRENCY_SERVICE_ID_API_KEY }}
        run: |
          mkdir image
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          find image_trivy -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          find image_syft -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          find image_grype -mindepth 1 -exec mv -t image {} + 2>/dev/null || true
          tar cvzf image_scanner.tar.gz image
          chmod +x ./gha-script/upload-scripts/upload_file.sh
          bash ./gha-script/upload-scripts/upload_file.sh image_scanner.tar.gz

  final_summary:
    name: Final Summary Stage
    needs:
      - ubi_slot_0
      - ubi_slot_1
      - ubi_slot_2
      - source_scanner
      - wheel_license_extract

    if: |
      always() &&
      needs.ubi_slot_0.result == 'success' &&
      needs.source_scanner.result == 'success'

    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download package-cache
        uses: actions/download-artifact@v7
        with:
          name: package-cache

      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz

      - name: Create and activate venv
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install requests deprecated xlsxwriter packaging

          # Export environment variables
          export PYTHONPATH=$(pwd):$(pwd)/process_bom/

      - name: Summarize build results
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
          IAM_WRITER_API_KEY: ${{ secrets.IAM_WRITER_API_KEY }}
          SERVICE_INSTANCE_ID: ${{ secrets.SERVICE_INSTANCE_ID }}
        run: |
          echo "Sourcing variable.sh and scanner-env.sh..........................................."
          chmod +x package-cache/variable.sh
          chmod +x package-cache/scanner-env.sh
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          echo "===== variable.sh ====="
          cat package-cache/variable.sh
          echo "===== scanner-env.sh ====="
          cat package-cache/scanner-env.sh
          echo "-------------package name : ${PACKAGE_NAME}--------------------"
          echo "-------------version : ${VERSION}--------------------"
          pwd
          chmod +x process_bom/*.py || true
          export PYTHONPATH="/tmp/_actions-runner-working-dir/build-scripts/build-scripts:/tmp/_actions-runner-working-dir/build-scripts/build-scripts/process_bom"
          python -m process_bom.run_currency_processor
